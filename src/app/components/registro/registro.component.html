<div class="register-page">

  <div
    class="register-card"
    [class.selection-card]="modo === 'seleccion'"
  >

    <div class="brand">
      <div class="brand-mark">A</div>
      <span>AmiApp</span>
    </div>

    <!-- ========================================= -->
    <!-- SELECCIÓN DE TIPO DE CUENTA -->
    <!-- ========================================= -->

    <ng-container *ngIf="modo === 'seleccion'">

      <div class="register-header">
        <h1>Creá tu cuenta</h1>
        <p>
          Elegí cómo querés empezar a usar AmiApp.
        </p>
      </div>

      <div class="account-options">

        <button
          type="button"
          class="account-option"
          (click)="seleccionarModo('organizacion')"
        >
          <span class="option-icon">
            <i class="fas fa-clinic-medical"></i>
          </span>

          <span class="option-copy">
            <strong>Crear una organización</strong>
            <small>
              Para administrar tu consultorio, clínica o equipo desde AmiApp.
            </small>
          </span>

          <i class="fas fa-chevron-right option-arrow"></i>
        </button>

        <button
          type="button"
          class="account-option"
          (click)="seleccionarModo('usuario')"
        >
          <span class="option-icon">
            <i class="fas fa-user"></i>
          </span>

          <span class="option-copy">
            <strong>Crear una cuenta personal</strong>
            <small>
              Creá tu usuario y unite a organizaciones cuando te inviten.
            </small>
          </span>

          <i class="fas fa-chevron-right option-arrow"></i>
        </button>

      </div>

      <div class="invitation-box">
        <span>
          ¿Ya te compartieron un código?
        </span>

        <button
          type="button"
          (click)="seleccionarModo('invitacion')"
        >
          Usar código de invitación
        </button>
      </div>

    </ng-container>

    <!-- ========================================= -->
    <!-- FORMULARIO -->
    <!-- ========================================= -->

    <ng-container *ngIf="modo !== 'seleccion'">

      <button
        type="button"
        class="back-button"
        (click)="volverSeleccion()"
      >
        <i class="fas fa-arrow-left"></i>
        Cambiar tipo de cuenta
      </button>

      <div class="register-header form-header">
        <h1>{{ tituloFormulario }}</h1>
        <p>{{ descripcionFormulario }}</p>
      </div>

      <form (ngSubmit)="registrar()">

        <div
          class="input-group"
          *ngIf="modo === 'organizacion'"
        >
          <label for="organizacion">
            Nombre de la organización
          </label>

          <input
            id="organizacion"
            type="text"
            placeholder="Ej. Consultorio Médico Central"
            [(ngModel)]="nombreOrganizacion"
            name="nombreOrganizacion"
            autocomplete="organization"
            required
          />
        </div>

        <div
          class="input-group invitation-code-group"
          *ngIf="modo === 'invitacion'"
        >
          <label for="codigoInvitacion">
            Código de invitación
          </label>

          <input
            id="codigoInvitacion"
            class="invitation-code-input"
            type="text"
            placeholder="ABCD1234"
            [(ngModel)]="codigoInvitacion"
            (input)="normalizarCodigo()"
            name="codigoInvitacion"
            autocomplete="off"
            maxlength="20"
            required
          />

          <small class="field-help">
            El código define automáticamente a qué organización y con qué rol vas a ingresar.
          </small>
        </div>

        <div class="form-row">

          <div class="input-group">
            <label for="nombre">
              Nombre
            </label>

            <input
              id="nombre"
              type="text"
              placeholder="Juan"
              [(ngModel)]="nombre"
              name="nombre"
              autocomplete="given-name"
              required
            />
          </div>

          <div class="input-group">
            <label for="apellido">
              Apellido
            </label>

            <input
              id="apellido"
              type="text"
              placeholder="Pérez"
              [(ngModel)]="apellido"
              name="apellido"
              autocomplete="family-name"
              required
            />
          </div>

        </div>

        <div class="input-group">
          <label for="email">
            Correo electrónico
          </label>

          <input
            id="email"
            type="email"
            placeholder="tu@email.com"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">
            Contraseña
          </label>

          <div class="password-wrapper">

            <input
              id="password"
              [type]="mostrarPassword ? 'text' : 'password'"
              placeholder="Mínimo 6 caracteres"
              [(ngModel)]="password"
              name="password"
              autocomplete="new-password"
              required
            />

            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              [attr.aria-label]="
                mostrarPassword
                  ? 'Ocultar contraseña'
                  : 'Mostrar contraseña'
              "
            >
              <i
                class="fa"
                [ngClass]="
                  mostrarPassword
                    ? 'fa-eye-slash'
                    : 'fa-eye'
                "
              ></i>
            </button>

          </div>
        </div>

        <div class="input-group">
          <label for="repetirPassword">
            Repetir contraseña
          </label>

          <div class="password-wrapper">

            <input
              id="repetirPassword"
              [type]="
                mostrarRepetirPassword
                  ? 'text'
                  : 'password'
              "
              placeholder="Repetí tu contraseña"
              [(ngModel)]="repetirPassword"
              name="repetirPassword"
              autocomplete="new-password"
              required
            />

            <button
              type="button"
              class="password-toggle"
              (click)="toggleRepetirPassword()"
              [attr.aria-label]="
                mostrarRepetirPassword
                  ? 'Ocultar contraseña'
                  : 'Mostrar contraseña'
              "
            >
              <i
                class="fa"
                [ngClass]="
                  mostrarRepetirPassword
                    ? 'fa-eye-slash'
                    : 'fa-eye'
                "
              ></i>
            </button>

          </div>
        </div>

        <label class="legal-consent">

          <input
            type="checkbox"
            [(ngModel)]="aceptaTerminos"
            name="aceptaTerminos"
            required
          />

          <span>
            He leído y acepto los
            <strong>Términos y Condiciones</strong>
            y la
            <a
              href="/privacidad"
              target="_blank"
              rel="noopener noreferrer"
            >
              Política de Privacidad
            </a>.
          </span>

        </label>

        <button
          type="submit"
          class="btn-register"
          [disabled]="cargando"
        >
          <span
            *ngIf="cargando"
            class="spinner"
          ></span>

          <span>
            {{ textoBoton }}
          </span>
        </button>

      </form>

    </ng-container>

    <div class="login-section">
      <span>¿Ya tenés una cuenta?</span>

      <button
        type="button"
        class="login-link"
        (click)="volverLogin()"
      >
        Iniciar sesión
      </button>
    </div>

  </div>

</div>
